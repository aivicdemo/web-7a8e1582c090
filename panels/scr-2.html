    <script>
window.AIVIC_API_URL = "https://jqykrkgdvngp7qvmavufg5tohq0xwdzb.lambda-url.us-east-1.on.aws/";
window.AIVIC_APP_ID = "session-1780284530342";
window.AIVIC_SYSTEM_NAME = "Web発注プラットフォームの構築";
window.AIVIC_TABLES = [];
window.AIVIC_PRESET_SEED = {};
window.AIVIC_PAGE_SCREEN_ID = "scr-2";
window.AIVIC_PAGE_INIT_JS = "function(container, apiUrl, tables) {\n  let currentData = tables[0]?.records || [];\n  let sortField = '';\n  let sortDirection = 'asc';\n\n  // ステータス別の色分け\n  function getStatusBadge(status) {\n    const statusColors = {\n      '要件定義': 'background: #3b82f6; color: #fff;',\n      '設計中': 'background: #8b5cf6; color: #fff;',\n      '開発中': 'background: #f59e0b; color: #fff;',\n      'テスト中': 'background: #ef4444; color: #fff;',\n      'リリース済': 'background: #10b981; color: #fff;',\n      '保守運用': 'background: #6b7280; color: #fff;'\n    };\n    const style = statusColors[status] || 'background: #6b7280; color: #fff;';\n    return `<span class=\"px-2 py-1 text-xs rounded-full\" style=\"${style}\">${status || '未設定'}</span>`;\n  }\n\n  // 優先度別の色分け\n  function getPriorityBadge(priority) {\n    const priorityColors = {\n      '高': 'background: #ef4444; color: #fff;',\n      '中': 'background: #f59e0b; color: #fff;',\n      '低': 'background: #10b981; color: #fff;'\n    };\n    const style = priorityColors[priority] || 'background: #6b7280; color: #fff;';\n    return `<span class=\"px-2 py-1 text-xs rounded-full\" style=\"${style}\">${priority || '中'}</span>`;\n  }\n\n  // 進捗バーの生成\n  function getProgressBar(progress) {\n    const percent = Math.min(100, Math.max(0, progress || 0));\n    const color = percent >= 80 ? '#10b981' : percent >= 50 ? '#f59e0b' : '#ef4444';\n    return `\n      <div class=\"w-full bg-gray-200 rounded-full h-2\" style=\"background: rgba(255,255,255,0.1);\">\n        <div class=\"h-2 rounded-full\" style=\"width: ${percent}%; background: ${color};\"></div>\n      </div>\n      <span class=\"text-xs ml-2\" style=\"color: var(--text-muted);\">${percent}%</span>\n    `;\n  }\n\n  // テーブル再描画関数\n  function renderRows(rows) {\n    const tbody = container.querySelector('#projects-tbody');\n    tbody.innerHTML = rows.map(row => `\n      <tr class=\"hover:bg-opacity-50 cursor-pointer\" data-id=\"${row.id || ''}\" style=\"border-bottom: 1px solid rgba(255,255,255,0.08);\">\n        <td class=\"py-3 px-3\">\n          <div class=\"font-medium\" style=\"color: var(--text);\">${row.projectName || '未設定'}</div>\n          <div class=\"text-xs\" style=\"color: var(--text-muted);\">${row.description || ''}</div>\n        </td>\n        <td class=\"py-3 px-3\" style=\"color: var(--text);\">${row.clientName || '未設定'}</td>\n        <td class=\"py-3 px-3\">${getStatusBadge(row.status)}</td>\n        <td class=\"py-3 px-3\">${getPriorityBadge(row.priority)}</td>\n        <td class=\"py-3 px-3\" style=\"color: var(--text);\">¥${(row.budget || 0).toLocaleString()}</td>\n        <td class=\"py-3 px-3\" style=\"color: var(--text);\">${row.startDate || '--'}</td>\n        <td class=\"py-3 px-3\">\n          <div class=\"flex items-center\">\n            ${getProgressBar(row.progress)}\n          </div>\n        </td>\n        <td class=\"py-3 px-3\">\n          <div class=\"flex gap-1\">\n            <button class=\"action-btn secondary text-xs px-2 py-1 edit-btn\" data-id=\"${row.id || ''}\">編集</button>\n            <button class=\"action-btn secondary text-xs px-2 py-1 delete-btn\" data-id=\"${row.id || ''}\">削除</button>\n          </div>\n        </td>\n      </tr>\n    `).join('');\n\n    // 結果件数の更新\n    container.querySelector('#result-count').textContent = `${rows.length}件の案件を表示中`;\n    container.querySelector('#last-updated').textContent = new Date().toLocaleString();\n\n    updateKPIs(rows);\n  }\n\n  // KPI更新\n  function updateKPIs(rows) {\n    const total = rows.length;\n    const active = rows.filter(r => ['要件定義', '設計中', '開発中', 'テスト中'].includes(r.status)).length;\n    const totalBudget = rows.reduce((sum, r) => sum + (r.budget || 0), 0);\n    const completed = rows.filter(r => r.status === 'リリース済').length;\n    const completionRate = total > 0 ? Math.round((completed / total) * 100) : 0;\n\n    container.querySelector('#kpi-total').textContent = total;\n    container.querySelector('#kpi-active').textContent = active;\n    container.querySelector('#kpi-budget').textContent = `¥${totalBudget.toLocaleString()}`;\n    container.querySelector('#kpi-completion').textContent = `${completionRate}%`;\n  }\n\n  // ソート機能\n  function sortData(field) {\n    if (sortField === field) {\n      sortDirection = sortDirection === 'asc' ? 'desc' : 'asc';\n    } else {\n      sortField = field;\n      sortDirection = 'asc';\n    }\n\n    currentData.sort((a, b) => {\n      let aVal = a[field] || '';\n      let bVal = b[field] || '';\n      \n      if (field === 'budget') {\n        aVal = parseFloat(aVal) || 0;\n        bVal = parseFloat(bVal) || 0;\n      } else if (field === 'startDate') {\n        aVal = new Date(aVal || '1970-01-01');\n        bVal = new Date(bVal || '1970-01-01');\n      }\n\n      if (aVal < bVal) return sortDirection === 'asc' ? -1 : 1;\n      if (aVal > bVal) return sortDirection === 'asc' ? 1 : -1;\n      return 0;\n    });\n\n    renderRows(currentData);\n  }\n\n  // 初期データの描画\n  renderRows(currentData);\n\n  // 最新データの取得\n  window.aivicApi.list(0).then(rows => {\n    if (rows) {\n      currentData = rows;\n      renderRows(currentData);\n    }\n  });\n\n  // 検索機能\n  container.querySelector('#btn-search').addEventListener('click', () => {\n    const keyword = container.querySelector('#search-keyword').value.toLowerCase();\n    const statusFilter = container.querySelector('#filter-status').value;\n    const priorityFilter = container.querySelector('#filter-priority').value;\n\n    window.aivicApi.list(0).then(rows => {\n      if (rows) {\n        let filtered = rows.filter(row => {\n          const matchKeyword = !keyword || \n            (row.projectName || '').toLowerCase().includes(keyword) ||\n            (row.clientName || '').toLowerCase().includes(keyword) ||\n            (row.description || '').toLowerCase().includes(keyword);\n          \n          const matchStatus = !statusFilter || row.status === statusFilter;\n          const matchPriority = !priorityFilter || row.priority === priorityFilter;\n\n          return matchKeyword && matchStatus && matchPriority;\n        });\n\n        currentData = filtered;\n        renderRows(filtered);\n      }\n    });\n  });\n\n  // ソートイベント\n  container.addEventListener('click', (e) => {\n    const sortBtn = e.target.closest('[data-sort]');\n    if (sortBtn) {\n      sortData(sortBtn.dataset.sort);\n    }\n  });\n\n  // 行クリックで詳細画面へ\n  container.addEventListener('click', (e) => {\n    const row = e.target.closest('tr[data-id]');\n    if (row && !e.target.closest('button')) {\n      window.showScreen('scr-3');\n    }\n  });\n\n  // 編集・削除ボタン\n  container.addEventListener('click', async (e) => {\n    const editBtn = e.target.closest('.edit-btn');\n    const deleteBtn = e.target.closest('.delete-btn');\n\n    if (editBtn) {\n      window.showScreen('scr-3');\n    }\n\n    if (deleteBtn) {\n      if (!confirm('この案件を削除しますか？')) return;\n      \n      const success = await window.aivicApi.delete(0, deleteBtn.dataset.id);\n      if (success) {\n        const updatedRows = await window.aivicApi.list(0);\n        if (updatedRows) {\n          currentData = updatedRows;\n          renderRows(updatedRows);\n        }\n      }\n    }\n  });\n\n  // CSVエクスポート\n  container.querySelector('#btn-export').addEventListener('click', async () => {\n    const rows = await window.aivicApi.list(0);\n    if (!rows) return;\n\n    const headers = ['案件名', '顧客名', 'ステータス', '優先度', '予算', '開始日', '進捗率', '説明'];\n    const csvContent = [\n      headers.join(','),\n      ...rows.map(row => [\n        `\"${(row.projectName || '').replace(/\"/g, '\"\"')}\"`,\n        `\"${(row.clientName || '').replace(/\"/g, '\"\"')}\"`,\n        `\"${(row.status || '').replace(/\"/g, '\"\"')}\"`,\n        `\"${(row.priority || '').replace(/\"/g, '\"\"')}\"`,\n        row.budget || 0,\n        `\"${(row.startDate || '').replace(/\"/g, '\"\"')}\"`,\n        row.progress || 0,\n        `\"${(row.description || '').replace(/\"/g, '\"\"')}\"`\n      ].join(','))\n    ].join('\\n');\n\n    const blob = new Blob(['\\uFEFF' + csvContent], { type: 'text/csv;charset=utf-8;' });\n    const link = document.createElement('a');\n    link.href = URL.createObjectURL(blob);\n    link.download = `web発注プラットフォーム案件一覧_${new Date().toISOString().split('T')[0]}.csv`;\n    link.click();\n  });\n}";
</script>

    <style>
        :root {
            --primary: #2e844a;
            --primary-hover: #1e5f35;
            --primary-light: #e8f5e8;
            --bg-main: #f8f9fa;
            --bg-card: #ffffff;
            --bg-sidebar: #f4f6f9;
            --border: #e5e5e5;
            --border-light: #f0f0f0;
            --text: #181818;
            --text-muted: #4a4a4a;
            --text-light: #6b7280;
            --top-bar-bg: #ffffff;
            --top-bar-border: #d8dde6;
            --success: #10b981;
            --warning: #f59e0b;
            --error: #ef4444;
            --radius-sm: 4px;
            --radius: 6px;
            --radius-lg: 8px;
            --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
            --shadow: 0 1px 3px 0 rgb(0 0 0 / 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-main);
            color: var(--text);
            line-height: 1.4;
            font-size: 14px;
        }

        .app-layout {
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        .sidebar {
            width: 260px;
            background: var(--bg-sidebar);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
        }

        .sidebar-header {
            padding: 20px 16px 16px;
            border-bottom: 1px solid var(--border-light);
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 700;
            font-size: 16px;
            color: var(--text);
        }

        .logo-icon {
            width: 28px;
            height: 28px;
            background: linear-gradient(135deg, var(--primary), var(--primary-hover));
            border-radius: var(--radius);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 600;
            font-size: 12px;
        }

        .nav-section {
            padding: 16px 12px 8px;
        }

        .nav-section-title {
            font-size: 11px;
            font-weight: 600;
            color: var(--text-light);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
            padding: 0 8px;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 12px;
            margin: 1px 0;
            border-radius: var(--radius);
            color: var(--text-muted);
            text-decoration: none;
            font-weight: 500;
            font-size: 13px;
            transition: all 0.15s ease;
            cursor: pointer;
            border: none;
            background: none;
            width: 100%;
            text-align: left;
        }

        .nav-item:hover {
            background: rgba(46, 132, 74, 0.08);
            color: var(--text);
        }

        .nav-item.aivic-active {
            background: var(--primary-light);
            color: var(--primary);
            font-weight: 600;
        }

        .nav-icon {
            width: 16px;
            height: 16px;
            opacity: 0.8;
        }

        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .top-bar {
            background: var(--top-bar-bg);
            border-bottom: 1px solid var(--top-bar-border);
            padding: 0 24px;
            height: 56px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
        }

        .page-title {
            font-size: 18px;
            font-weight: 600;
            color: var(--text);
        }

        .top-bar-actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 12px;
            border-radius: var(--radius);
            font-size: 13px;
            font-weight: 500;
            text-decoration: none;
            border: 1px solid var(--border);
            background: var(--bg-card);
            color: var(--text);
            cursor: pointer;
            transition: all 0.15s ease;
        }

        .btn:hover {
            background: var(--bg-main);
            border-color: var(--text-light);
        }

        .btn-primary {
            background: var(--primary);
            border-color: var(--primary);
            color: white;
        }

        .btn-primary:hover {
            background: var(--primary-hover);
            border-color: var(--primary-hover);
        }

        .user-menu {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 10px;
            border-radius: var(--radius-lg);
            background: var(--bg-main);
            border: 1px solid var(--border-light);
            cursor: pointer;
            transition: all 0.15s ease;
        }

        .user-menu:hover {
            border-color: var(--border);
        }

        .user-avatar {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: var(--primary);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 10px;
            font-weight: 600;
        }

        .user-name {
            font-size: 13px;
            font-weight: 500;
            color: var(--text);
        }

        .content-area {
            flex: 1;
            overflow: auto;
            background: var(--bg-main);
        }

        .status-indicator {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 2px 6px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }

        .status-active {
            background: rgba(16, 185, 129, 0.1);
            color: var(--success);
        }

        .status-pending {
            background: rgba(245, 158, 11, 0.1);
            color: var(--warning);
        }

        .status-error {
            background: rgba(239, 68, 68, 0.1);
            color: var(--error);
        }

        @media (max-width: 768px) {
            .sidebar {
                width: 240px;
            }
            
            .top-bar {
                padding: 0 16px;
            }
            
            .page-title {
                font-size: 16px;
            }
        }
    </style>
</head>

                    </svg>

        <main class="main-content">

                <div data-aivic-panel="scr-2" style="display:block"><div class="flex flex-col h-full">

    <div class="grid grid-cols-4 gap-3">
      <div>
        <label class="block text-xs font-medium mb-1" style="color: var(--text-muted);">案件名・顧客名</label>
        <input type="text" id="search-keyword" data-testid="search-keyword" placeholder="キーワード検索" 
               class="w-full px-3 py-2 text-sm rounded-md" 
               style="background: rgba(0,0,0,0.25); border: 1px solid rgba(255,255,255,0.18); color: var(--text);">

                class="w-full px-3 py-2 text-sm rounded-md"

                class="w-full px-3 py-2 text-sm rounded-md"

          <option value="">全ての優先度</option>

      <div class="flex items-end">
        <button class="action-btn w-full" data-testid="search-button" id="btn-search">
          <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>

  </div>

  <!-- KPI カード部分 -->
  <div class="p-3 border-b" style="border-color: rgba(255,255,255,0.12);">
    <div class="grid grid-cols-4 gap-3">
      <div class="card p-3" data-testid="kpi-total-projects">

        <div class="text-2xl font-bold" style="color: var(--primary);" id="kpi-total">0</div>
      </div>
      <div class="card p-3" data-testid="kpi-active-projects">
        <div class="text-xs font-medium mb-1" style="color: var(--text-muted);">進行中案件</div>

      <div class="card p-3" data-testid="kpi-total-budget">

  </div>

  <!-- メインテーブル -->
  <div class="flex-1 overflow-auto">
    <div class="table-wrap">
      <table data-testid="projects-list" class="w-full">
        <thead>
          <tr>
            <th class="text-left py-3 px-3 cursor-pointer hover:bg-opacity-50" data-sort="projectName">
              案件名
              <svg class="w-3 h-3 inline ml-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 9l4-4 4 4m0 6l-4 4-4-4"></path>
              </svg>
            </th>
            <th class="text-left py-3 px-3">顧客名</th>
            <th class="text-left py-3 px-3 cursor-pointer" data-sort="status">
              ステータス
              <svg class="w-3 h-3 inline ml-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 9l4-4 4 4m0 6l-4 4-4-4"></path>
              </svg>
            </th>
            <th class="text-left py-3 px-3">優先度</th>
            <th class="text-left py-3 px-3 cursor-pointer" data-sort="budget">
              予算
              <svg class="w-3 h-3 inline ml-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 9l4-4 4 4m0 6l-4 4-4-4"></path>
              </svg>

            <th class="text-left py-3 px-3 cursor-pointer" data-sort="startDate">
              開始日
              <svg class="w-3 h-3 inline ml-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 9l4-4 4 4m0 6l-4 4-4-4"></path>
              </svg>

          <!-- データは JavaScript で動的に挿入 -->

  <!-- フッター統計 -->
  <div class="p-3 border-t text-sm" style="border-color: rgba(255,255,255,0.12); background: var(--bg-card); color: var(--text-muted);">

                <div data-aivic-panel="scr-3" style="display:none"></div>

    <script>
(function() {
  var TABLE_DEFS = window.AIVIC_TABLES || [];
  var PRESET_SEED = window.AIVIC_PRESET_SEED || {};
  var SYSTEM_NAME = window.AIVIC_SYSTEM_NAME || "";
  var APP_ID = window.AIVIC_APP_ID || "";
  var API_URL = (window.AIVIC_API_URL && window.AIVIC_API_URL !== "REPLACE_WITH_API_URL")
    ? window.AIVIC_API_URL : window.location.origin;

  // 通知 helper（SPA 版と同じ）
  window.aivicNotify = (function() {
    function ensureContainer() {
      var c = document.getElementById("aivic-toast-container");
      if (c) return c;
      c = document.createElement("div");
      c.id = "aivic-toast-container";
      c.style.cssText = "position:fixed;top:16px;right:16px;z-index:9999;display:flex;flex-direction:column;gap:8px;pointer-events:none;max-width:360px;";
      document.body.appendChild(c);
      return c;
    }
    function show(msg, type) {
      var c = ensureContainer();
      var el = document.createElement("div");
      el.textContent = msg;
      el.style.cssText = "padding:10px 16px;border-radius:8px;font-size:13px;line-height:1.4;pointer-events:auto;color:#fff;background:" + (type === "error" ? "#dc2626" : "#d97706");
      c.appendChild(el);
      setTimeout(function() {
        el.style.transition = "opacity .3s";
        el.style.opacity = "0";
        setTimeout(function() { if (el.parentNode) el.parentNode.removeChild(el); }, 320);
      }, type === "error" ? 6000 : 4500);
    }
    return {
      error: function(msg) { show("❌ " + msg, "error"); },
      warn:  function(msg) { show("⚠️ " + msg, "warn"); },
    };
  })();

  // CRUD API（SPA 版と同じ）
  window.aivicApi = (function() {
    function dbErr(op) { window.aivicNotify.error("データベースエラー（" + op + "）: APIサーバーに接続できません。"); }
    function newId() { return typeof crypto !== "undefined" && crypto.randomUUID ? crypto.randomUUID() : "id-" + Date.now() + "-" + Math.random().toString(36).slice(2); }
    function q(i) {
      var t = TABLE_DEFS[i];
      var dbP = (window.AIVIC_DB_TYPE && window.AIVIC_DB_TYPE !== "dynamodb") ? "&db=" + encodeURIComponent(window.AIVIC_DB_TYPE) : "";
      return "?app=" + encodeURIComponent(APP_ID) + "&system=" + encodeURIComponent(SYSTEM_NAME) + "&table=" + encodeURIComponent(t ? t.tableName : "table" + i) + dbP;
    }
    return {
      list: async function(tableIndex) {
        if (!API_URL) return [];
        try { var r = await fetch(API_URL + "/api/" + tableIndex + q(tableIndex)); var d = await r.json(); return Array.isArray(d) ? d : (d.items || []); }
        catch(e) { dbErr("データ取得"); return []; }
      },
      save: async function(tableIndex, item) {
        if (!API_URL) { dbErr("保存"); return null; }
        var now = new Date().toISOString();
        var rec = Object.assign({}, item, { id: item.id || newId(), createdAt: item.createdAt || now, updatedAt: now });
        try { var r = await fetch(API_URL + "/api/" + tableIndex + q(tableIndex), { method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(rec) }); return await r.json(); }
        catch(e) { dbErr("保存"); return null; }
      },
      update: async function(tableIndex, id, changes) {
        if (!API_URL) { dbErr("更新"); return null; }
        try { var r = await fetch(API_URL + "/api/" + tableIndex + "/" + id + q(tableIndex), { method:"PUT", headers:{"Content-Type":"application/json"}, body:JSON.stringify(Object.assign({}, changes, {updatedAt: new Date().toISOString()})) }); return await r.json(); }
        catch(e) { dbErr("更新"); return null; }
      },
      delete: async function(tableIndex, id) {
        if (!API_URL) { dbErr("削除"); return {deleted:false}; }
        try { await fetch(API_URL + "/api/" + tableIndex + "/" + id + q(tableIndex), {method:"DELETE"}); return {deleted:true}; }
        catch(e) { dbErr("削除"); return {deleted:false}; }
      },
    };
  })();

  // showScreen はマルチページ構成ではページ遷移として動く。
  // パネル切替 (旧 SPA 動作) ではなく ./<id>.html への navigate に再定義する。
  // 既存の AI 生成 shell が onclick="showScreen('x')" の形で書いていても透過的に動く。
  //
  // 防御層:
  // (a) 同じ画面 ID なら no-op（AIVIC_PAGE_SCREEN_ID 一致 / pathname 一致のどちらか）
  // (b) 同じ navigate を 100ms 以内に繰り返したら break loop（onclick 連打ではなく自動ループ対策）
  // (c) DOMContentLoaded 直後 1.5s 以内の「自動 navigate」は警告 + 抑制（手動 click は通す）
  var _aivicNavLastTime = 0;
  var _aivicNavLastTarget = "";
  var _aivicReady = false;
  window.showScreen = function(screenId) {
    if (!screenId) return;
    if (screenId === window.AIVIC_PAGE_SCREEN_ID) return; // 既に該当ページに居る
    // pathname ベースの保険: AIVIC_PAGE_SCREEN_ID が未設定でも、現在 URL と一致したら抑制
    var targetPath = './' + encodeURIComponent(screenId) + '.html';
    var currentName = (window.location.pathname.split('/').pop() || '');
    if (currentName === (encodeURIComponent(screenId) + '.html') ||
        currentName === (screenId + '.html')) {
      return;
    }
    var now = Date.now();
    if (_aivicNavLastTarget === targetPath && (now - _aivicNavLastTime) < 100) {
      console.warn('[aivic] showScreen 連続呼び出し検知。無限ループ防止のため抑制:', screenId);
      return;
    }
    if (!_aivicReady) {
      // ページロード直後の自動 navigate は AI shell の load-time 副作用の可能性が高い。
      // ボタンクリック等のユーザー操作は ready 後なので影響しない。
      console.warn('[aivic] DOMContentLoaded 前の showScreen 呼び出し。抑制:', screenId);
      return;
    }
    _aivicNavLastTime = now;
    _aivicNavLastTarget = targetPath;
    window.location.href = targetPath;
  };

  // 初回マウント時のサンプルデータ投入
  function seedAllIfEmpty() {
    if (!API_URL) return Promise.resolve();
    return Promise.all(TABLE_DEFS.map(function(t, i) {
      var preset = PRESET_SEED[t.tableName];
      if (!Array.isArray(preset) || preset.length === 0) return Promise.resolve();
      return window.aivicApi.list(i).then(function(existing) {
        if (existing && existing.length > 0) return;
        return Promise.all(preset.map(function(row) { return window.aivicApi.save(i, row); }));
      }).catch(function() {});
    }));
  }

  // ── 初期表示: このページ専用の panel に initFn を実行 ──
  // window.AIVIC_PAGE_SCREEN_ID と AIVIC_PAGE_INIT_JS は composeMultipagePages
  // でページ単位に埋め込まれる。
  document.addEventListener("DOMContentLoaded", function() {
    // 1.5 秒後に必ず _aivicReady を立てる（initFn が走らないページや失敗ページでも
    // ユーザーが操作できるようにする保険）。initFn 完了時にも立てるので早い方が勝つ。
    setTimeout(function() { _aivicReady = true; }, 1500);
    var pageScreenId = window.AIVIC_PAGE_SCREEN_ID;
    if (!pageScreenId) return;

    // sidebar / nav の active class を付与（現在ページのリンクを強調）
    document.querySelectorAll('[data-aivic-nav]').forEach(function(btn) {
      var isActive = btn.getAttribute("data-aivic-nav") === pageScreenId;
      btn.classList.toggle("aivic-active", isActive);
      btn.setAttribute("aria-current", isActive ? "page" : "false");
    });

    var container = document.querySelector('[data-aivic-panel="' + pageScreenId + '"]');
    if (!container) return;

    // **content 要素の hidden 強制除去（2026-05-24 Playwright 大量 fail 対応）**:
    // AI が生成した panel HTML には class="hidden" / hidden 属性 / style="display:none"
    // が content 要素（#xxx-tbody / #xxx-list / [data-testid="error-message"] 等）に付いて
    // いることがある。それを Playwright が toBeVisible() で待ち続けて timeout する事故が頻発。
    //
    // ポリシー: panel コンテナ配下の全要素について以下を実行:
    //   - class="hidden" / display:none / hidden 属性を **content 要素では除去**
    //   - **modal 系**（.modal, .modal-backdrop, [role="dialog"], [data-modal] 等）は除外
    //     （これらは仕様上初期非表示が正しい）
    var isModalLike = function(el) {
      if (!el || !el.classList) return false;
      var cn = String(el.className || "");
      if (/modal|dialog|overlay|popup|dropdown|tooltip/i.test(cn)) return true;
      var role = el.getAttribute && el.getAttribute("role");
      if (role === "dialog" || role === "alertdialog" || role === "tooltip" || role === "menu") return true;
      if (el.hasAttribute && (el.hasAttribute("data-modal") || el.hasAttribute("data-dropdown") || el.hasAttribute("data-popup"))) return true;
      return false;
    };
    var unhideContentElements = function(root) {
      var all = root.querySelectorAll('.hidden, [hidden], [style*="display:none"], [style*="display: none"]');
      for (var k = 0; k < all.length; k++) {
        var el = all[k];
        // modal 系は触らない
        if (isModalLike(el)) continue;
        // parent chain で modal 内なら触らない
        var p = el.parentElement;
        var insideModal = false;
        while (p && p !== root) {
          if (isModalLike(p)) { insideModal = true; break; }
          p = p.parentElement;
        }
        if (insideModal) continue;
        // 除去
        el.classList.remove('hidden');
        el.removeAttribute('hidden');
        if (el.style && el.style.display === 'none') el.style.display = '';
      }
    };
    try { unhideContentElements(container); } catch (e) { console.warn('[aivic] unhideContent failed:', e); }

    var initJsSource = window.AIVIC_PAGE_INIT_JS;
    if (!initJsSource) {
      // initJs が無くてもサンプルデータ投入は走らせる
      seedAllIfEmpty();
      return;
    }
    var initFn = null;
    try {
      initFn = (new Function("return (" + initJsSource + ")"))();
    } catch (e) {
      console.error("[aivic] initJs compile error:", pageScreenId, e);
      return;
    }
    if (typeof initFn !== "function") return;

    seedAllIfEmpty().then(function() {
      return Promise.all(TABLE_DEFS.map(function(t, i) {
        return window.aivicApi.list(i)
          .then(function(records) { return Object.assign({}, t, { records: records }); })
          .catch(function() { return Object.assign({}, t, { records: [] }); });
      }));
    }).then(function(tables) {
      try { initFn(container, API_URL, tables); } catch (e) { console.error("[aivic] initFn error:", pageScreenId, e); }
      // 初期 panel init が一巡したら _aivicReady を立てる。以降のユーザー操作 (onclick) で
      // showScreen が呼ばれた場合は通常通り navigate する。
      _aivicReady = true;
    });
  });
})();

</script>
